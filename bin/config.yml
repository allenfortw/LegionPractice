      type: INK_SACK
      meta:
        ==: ItemMeta
        meta-type: UNSPECIFIC
        display-name: "\xa7a\xa7lHost Sumo Event"
    slot: 10
    command: /hostevent sumo
  - ==: GUIItem
    item:
      ==: org.bukkit.inventory.ItemStack
      type: POTION
      damage: 34
      meta:
        ==: ItemMeta
        meta-type: POTION
        display-name: "\xa7a\xa7lHost Brackets Event"
    slot: 12
    command: /hostevent brackets
  - ==: GUIItem
    item:
      ==: org.bukkit.inventory.ItemStack
      type: DIAMOND_SWORD
      meta:
        ==: ItemMeta
        meta-type: UNSPECIFIC
        display-name: "\xa7a\xa7lHost Last Man Standing Event"
    slot: 14
    command: /hostevent lms
  - ==: GUIItem
    item:
      ==: org.bukkit.inventory.ItemStack
      type: GOLD_SWORD
      meta:
        ==: ItemMeta
        meta-type: UNSPECIFIC
        display-name: "\xa7a\xa7lHost King of The Hill Event"
    slot: 16
    command: /hostevent koth
automatic-events:
  broadcast:
    #How often should the message be sent
    delay: 10
    #How many times should the message be sent
    times: 5
    #The messages for all events
    lms: '&c&l<host> is hosting an LMS event! Type /lms join!'
    brackets: '&c&l<host> is hosting a 1v1 tournament event! Type /brackets join!'
    sumo: '&c&l<host> is hosting a sumo event! Type /sumo join!'
    juggernaut: '&c&l<host> is hosting a juggernaut event! Type /juggernaut join!'
    koth: '&c&l<host> is hosting a KOTH event! Type /koth join!'
  #Default kits when hosting an automatic event
  juggernaut-kit: gapple
  juggernaut-player-kit: potion
  koth-kit: potion
  lms-kit: soup
  brackets-kit: potion
  sumo-kit: sumo
  times:
  #Format like this: time:lms (for example 15:30:lms)
  #LMS, koth, brackets, juggernaut, sumo
  - '15:30:lms'
brackets:
  #The command will be executed when a player wins the event
  #<player> will be replaced with the name of the player
  winner-cmd: eco give <player> 100
  #Start the event automatically when the number of players join
  auto-start: 15
  #After how many seconds should the event be started automatically
  auto-start-after-seconds: 10
sumo:
  #The command will be executed when a player wins the event
  #<player> will be replaced with the name of the player
  winner-cmd: eco give <player> 100
  #Start the event automatically when the number of players join
  auto-start: 15
  #After how many seconds should the event be started automatically
  auto-start-after-seconds: 10
koth:
  #Should the players be able to join or rejoin the event at any time
  anytime-join: true
  respawn: true
  #Team names
  team1: '&a&lTeam Green'
  team2: '&c&lTeam Red'
  #How many seconds should the capping time be
  timer: 300
#
#This feature is no longer available
#
strikecheat:
  download: '&c&lYou are required to download clientside-anticheat to join this queue.'
